[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "firedeploy-net"
version = "0.1.0"
description = "Deep reinforcement learning for multi-period mobile fire-unit deployment"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10,<3.14"
dependencies = ["torch>=2.6,<3", "numpy>=1.24,<3", "scipy>=1.10,<2", "pandas>=2,<3", "numba>=0.60,<1"]

[project.scripts]
firedeploy-train = "firedeploy.train:main"
firedeploy-infer = "firedeploy.infer:main"

[tool.setuptools.packages.find]
include = ["firedeploy*"]

[tool.setuptools]
license-files = ["LICENSE", "licenses/*.txt"]

[tool.ruff]
line-length = 100
